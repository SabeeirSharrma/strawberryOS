#
# /etc/pacman.conf — Strawberry OS ISO build
#
# Based on the archiso releng profile pacman.conf

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Strawberry OS repo — uncomment when the custom repo is hosted
# [strawberry]
# Server = https://<username>.github.io/strawberryOS/repo
# SigLevel = PackageRequired
